version: 2

project_name: squawk

builds:
  - id: squawk
    main: ./cmd/squawk
    binary: squawk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/stalane/squawk/internal/version.Version={{.Tag}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - assets/squawk.jpg

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  github:
    owner: stalane
    name: squawk
