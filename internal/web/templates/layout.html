{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>squawk</title>
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/static/icon.png" alt="" width="32" height="32">
      <span>squawk</span>
    </a>
    <nav>
      <a href="/" class="{{if eq .Page "compose"}}active{{end}}">Compose</a>
      <a href="/history" class="{{if eq .Page "history"}}active{{end}}">History</a>
      <a href="/audiences" class="{{if eq .Page "audiences"}}active{{end}}">Audiences</a>
      <a href="/settings" class="{{if eq .Page "settings"}}active{{end}}">Settings</a>
    </nav>
  </header>
  <main>{{template "content" .}}</main>
  <footer>Send-only. No accounts, no tracking, no inbox.</footer>
</body>
</html>{{end}}
