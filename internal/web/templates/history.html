{{define "content"}}
<h1>History</h1>
<form class="filters" method="get" action="/history">
  <input type="search" name="q" value="{{.Query}}" placeholder="Search alerts">
  <select name="severity">
    <option value="" {{if eq .Severity ""}}selected{{end}}>All severities</option>
    <option value="urgent" {{if eq .Severity "urgent"}}selected{{end}}>Urgent</option>
    <option value="warning" {{if eq .Severity "warning"}}selected{{end}}>Warning</option>
    <option value="info" {{if eq .Severity "info"}}selected{{end}}>Info</option>
  </select>
  <button type="submit">Filter</button>
</form>

{{if .Alerts}}
<table class="table">
  <thead>
    <tr><th>Sent</th><th>Severity</th><th>Alert</th><th>Audience</th><th>Status</th></tr>
  </thead>
  <tbody>
    {{range .Alerts}}
    <tr>
      <td class="muted">{{datetime .CreatedAt}}</td>
      <td><span class="badge sev-{{.Severity}}">{{.Severity}}</span></td>
      <td><a href="/alerts/{{.ID}}">{{.Line}}</a></td>
      <td>{{.Audience}}</td>
      <td><span class="badge {{if eq .Status "sent"}}ok{{else}}bad{{end}}">{{.Status}}</span></td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p class="empty">Nothing sent yet.</p>
{{end}}
{{end}}
